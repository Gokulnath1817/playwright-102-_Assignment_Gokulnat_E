
version: "0.1"

runson: ${matrix.os}

matrix:
  os:
    - win
    - linux

globalTimeout: 15
testSuiteTimeout: 10
testSuiteStep: 10

autosplit: false
retryOnFailure: false
concurrency: 2

env:
  BASE_URL: "https://www.testmuai.com/selenium-playground/"
  DEMO_TOKEN: "${{.secrets.DEMO_TOKEN}}"

pre:
  - npm ci
  - npx playwright install chromium

cacheKey: '{{ checksum "package-lock.json" }}'
cacheDirectories:
  - node_modules

testType: "playwright"

testSuites:
  - npm test

report: true

partialReports:
  - frameworkName: playwright
    location: playwright-report
    type: html

uploadArtefacts:
  - name: PlaywrightReports
    path:
      - test-results/**
      - playwright-report/**

jobLabel:
  - playwright-102
  - matrix
